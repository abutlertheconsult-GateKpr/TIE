/* T.I.E by Structure and Flow. Ink band header over a cream (light) or ink (dark) page, copper accent.
   Layout: one centered column. Home lists saved timers; each timer has edit, run, summary and stats screens. */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --fg: #151515;
  --muted: #66666b;
  --line: #dcdce0;
  --accent: #c4783c;
  --accent-fg: #151515;
  --good: #2e6b4f;
  --warn: #a8851f;
  --bad: #b4452f;
  --track: #e6e6ea;
  --head-bg: #121212;
  --head-fg: #f2f2f2;
  --head-muted: #8a8a90;
  --warn-bg: color-mix(in srgb, var(--warn) 16%, var(--surface)); --warn-line: color-mix(in srgb, var(--warn) 45%, var(--surface));
  --over-bg: color-mix(in srgb, var(--bad) 14%, var(--surface)); --over-line: color-mix(in srgb, var(--bad) 42%, var(--surface));
  --ok-bg: color-mix(in srgb, var(--good) 15%, var(--surface)); --ok-line: color-mix(in srgb, var(--good) 42%, var(--surface));
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --font-display: "Bebas Neue", "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-ui: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --wd: 400;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1c1c1e; --fg: #f2f2f2; --muted: #9b9b9f; --line: #333336;
    --accent: #c4783c; --accent-fg: #151515; --good: #78b995; --warn: #c9a43e; --bad: #e07a63; --track: #2a2a2d;
    --head-bg: #0a0a0a; --head-muted: #8a8a90;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1c1c1e; --fg: #f2f2f2; --muted: #9b9b9f; --line: #333336;
  --accent: #c4783c; --accent-fg: #151515; --good: #78b995; --warn: #c9a43e; --bad: #e07a63; --track: #2a2a2d;
  --head-bg: #0a0a0a; --head-muted: #8a8a90;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
select {
  width: 100%; font: 500 1rem var(--font-ui); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swatch { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; color: var(--muted); min-height: 44px; }
.swatch input[type="color"] { width: 44px; height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); flex: none; }
#splash { position: fixed; inset: 0; z-index: 50; background: var(--head-bg); color: var(--head-fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; pointer-events: none; opacity: 1; transition: opacity 0.35s ease; }
#splash.out { opacity: 0; }
#splash .logo { font-size: clamp(4rem, 26vw, 7rem); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
}
.brand {
  background: var(--head-bg); color: var(--head-fg);
  padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.brand-in { max-width: 512px; margin: 0 auto; display: flex; flex-direction: column; gap: 2px; }
.logo { font: var(--wd) 2rem/1 var(--font-display); letter-spacing: 0.09em; }
.logo i { font-style: normal; color: var(--accent); }
.tag { font: 500 0.625rem/1.2 var(--font-ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--head-muted); }
.app {
  max-width: 512px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding-top: 20px; padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font: var(--wd) 2rem/1.05 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; margin: 0; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
h2 { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.topbar { display: flex; align-items: center; gap: 8px; }
.topbar .spacer { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.row > * { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 120px; }
.card > .field { flex: none; }

    return (h > 0 ? h + ':' + (m < 10 ? '0' : '') + m : m) + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtMs(ms) { return fmt(ms / 1000); }
  function countdown(ms) { return ms >= 0 ? fmt(Math.ceil(ms / 1000)) : fmt(Math.floor(-ms / 1000)); }
  function driftSecs(ms) { return Math.round(Math.abs(ms) / 1000); }
  function driftCls(ms) { return driftSecs(ms) < 1 ? '' : (ms > 0 ? 'ahead' : 'behind'); }

  function textCls(ms) { var c = driftCls(ms); return c === 'ahead' ? 'good' : (c === 'behind' ? 'bad' : ''); }
  function whenText(ts) {
    var d = new Date(ts);

  }
  function avg(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 0; }

  /* ---------- Data helpers ---------- */
  function getTimer(id) { return db.timers.filter(function (t) { return t.id === id; })[0]; }
  function runsFor(tid) { return db.runs.filter(function (r) { return r.timerId === tid; }).sort(function (a, b) { return a.date - b.date; }); }

  /* ---------- App state ---------- */
  var root = document.getElementById('app');

  /* ---------- Views ---------- */

    else if (view.name === 'prun') { root.innerHTML = prunHTML(); updatePrun(); updateSound(); startTick(updatePrun); }
    else if (view.name === 'pdone') root.innerHTML = pDoneHTML();
    else if (view.name === 'summary') root.innerHTML = summaryHTML();
    else if (view.name === 'stats') root.innerHTML = statsHTML();
    else if (view.name === 'data') root.innerHTML = dataHTML();

      var pb = document.getElementById('pastebox');
      if (pb) { pb.value = pasteText; }
    }
  }

  function storageBanner() {
    return storageOK ? '' : '<div class="msg err">This browser is not keeping saved data. Use Backup on the Data screen before you close the page.</div>';
  }

  /* Home */
  function homeHTML() {
    var cards = db.timers.map(function (t) {

    var backup = db.lastBackup ? 'Last backup ' + whenText(db.lastBackup) : 'No backup yet';
    return '<div class="topbar"><h1>' + (homeTab === 'pomo' ? 'Pomodoro' : 'Your timers') + '</h1><span class="spacer"></span><button class="ghost small icon" data-act="data" aria-label="Settings" title="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>' +
      storageBanner() + tabsHTML() +

  }

  /* Edit */
  function newDraft(t) {
    if (t) return { id: t.id, isNew: false, name: t.name, total: t.total || timerTotalMin(t), tu: t.tu === 'h' ? 'h' : 'm', len: t.intervals[0].min, lu: t.intervals[0].u === 'h' ? 'h' : 'm', intervals: t.intervals.map(function (i) { return { id: i.id, name: i.name, min: i.min, u: i.u === 'h' ? 'h' : 'm' }; }) };
    return { id: uid(), isNew: true, name: '', total: 30, tu: 'm', len: 10, lu: 'm', intervals: [] };
  }
  function boxRef(k, i) {
    if (k === 'tot') return { o: draft, v: 'total', u: 'tu' };
    if (k === 'len') return { o: draft, v: 'len', u: 'lu' };
    if (k === 'iv') return { o: draft.intervals[i], v: 'min', u: 'u' };
    if (k === 'tf') return { o: sdraft.tasks[i], v: 'focus', u: 'fu' };
    return { o: sdraft.tasks[i], v: 'brk', u: 'bu' };
  }
  function timeBox(k, i, id, label, disabled) {
    var r = boxRef(k, i), hr = r.o[r.u] === 'h';
    return '<div class="tbox"><input type="text" inputmode="text" autocomplete="off" autocapitalize="off" id="' + id + '" data-f="tbox" data-k="' + k + '" data-i="' + i + '" value="' + (disabled ? '' : fmtBox(r.o[r.v], hr ? 'h' : 'm')) + '" placeholder="' + (disabled ? '-' : '0') + '" aria-label="' + label + (hr ? ' (hours:minutes)' : ' (minutes:seconds)') + '"' + (disabled ? ' disabled' : '') + '>' +
      '<button type="button" class="unit" data-act="unit" data-k="' + k + '" data-i="' + i + '"' + (disabled ? ' disabled' : '') + ' aria-label="' + label + ' unit, now ' + (hr ? 'hours' : 'minutes') + '. Tap to switch">' + (hr ? 'hr' : 'min') + '</button></div>';
  }
  function allocInfo() {
    var tot = round2(num(draft.total, 0));
    var al = round2(sum(draft.intervals.map(function (i) { return num(i.min, 0); })));
    return { tot: tot, al: al, left: round2(tot - al) };
  }
  function allocStatus() {
    var a = allocInfo();
    if (a.left > 0) return { text: 'Unallocated ' + fmt(a.left * 60), cls: 'behind' };
    if (a.left < 0) return { text: 'Over by ' + fmt(-a.left * 60), cls: 'behind' };
    return { text: 'Fully allocated', cls: 'ahead' };
  }
  function editHTML() {
    var cnt = draft.smode === 'cnt';
    var rows = draft.intervals.map(function (iv, i) {
      if (draft.reorder) {
        return '<div class="iv mv"><span class="nm">' + esc(iv.name) + '</span><span class="tm">' + fmtBox(iv.min, iv.u === 'h' ? 'h' : 'm') + (iv.u === 'h' ? ' hr' : ' min') + '</span>' +
          '<button class="ghost" data-act="mvup" data-i="' + i + '" aria-label="Move ' + esc(iv.name) + ' up"' + (i === 0 ? ' disabled' : '') + '>&uarr;</button>' +
          '<button class="ghost" data-act="mvdn" data-i="' + i + '" aria-label="Move ' + esc(iv.name) + ' down"' + (i === draft.intervals.length - 1 ? ' disabled' : '') + '>&darr;</button></div>';
      }
      return '<div class="iv">' +
        '<input type="text" id="ivn-' + i + '" data-f="ivname" data-i="' + i + '" value="' + esc(iv.name) + '" aria-label="Interval ' + (i + 1) + ' name">' +
        timeBox('iv', i, 'ivm-' + i, 'Interval ' + (i + 1) + ' length') +
        '<button class="x ghost" data-act="rmiv" data-i="' + i + '" aria-label="Remove interval ' + (i + 1) + '">&times;</button>' +
        '</div>';
    }).join('');
    var list = draft.intervals.length ?
      (draft.reorder ? '' : '<div class="cols"><span>Name</span><span>Time</span><span></span></div>') + '<div class="ivs">' + rows + '</div>' :
      '<div class="muted">No intervals yet. Use Quick split above or add one manually.</div>';
    var st = allocStatus();
    var del = draft.isNew ? '' :
      '<button class="danger' + (A('deltimer') ? ' armed' : '') + '" data-act="deltimer">' + (A('deltimer') ? 'Tap again to delete timer and its runs' : 'Delete timer') + '</button>';
    return '<div class="topbar"><button class="ghost small" data-act="home">&lsaquo; Cancel</button><h1>' + (draft.isNew ? 'New timer' : 'Edit timer') + '</h1></div>' +
      (msg ? '<div class="msg err">' + esc(msg.text) + '</div>' : '') +
      '<div class="card"><div class="field"><label for="tname">Timer name</label>' +
        '<input type="text" id="tname" data-f="tname" value="' + esc(draft.name) + '" placeholder="e.g. Morning practice"></div></div>' +
      '<div class="card"><h2>Quick split</h2>' +
        '<div class="row">' +
          '<div class="field"><label for="ttotal">Total time</label>' + timeBox('tot', 0, 'ttotal', 'Total time') + '</div>' +
          (cnt ?
            '<div class="field"><label for="tcount">Number of intervals</label><input type="number" id="tcount" data-f="tcount" value="' + (draft.count || 3) + '" min="1" max="200" step="1" inputmode="numeric"></div>' :
            '<div class="field"><label for="tlen">Each interval</label>' + timeBox('len', 0, 'tlen', 'Each interval') + '</div>') +
        '</div>' +
        '<div class="btns"><button data-act="smode" data-v="len" aria-pressed="' + !cnt + '" class="' + (cnt ? '' : 'sel') + '">By time per interval</button>' +
        '<button data-act="smode" data-v="cnt" aria-pressed="' + cnt + '" class="' + (cnt ? 'sel' : '') + '">By number of intervals</button></div>' +
        '<div class="muted">' + (cnt ? 'Splits the total evenly into that many intervals. ' : 'Fills the total with intervals of that length, and the last one takes what is left. ') + 'Split replaces the intervals below, and you can still edit them by hand. Every time box starts in minutes: 5 is 5 min and 5:30 is 5 min 30 sec. Tap min to switch it to hr, where 5:30 is 5 hours 30 min.</div>' +
        '<button data-act="qsplit">Split</button></div>' +
      '<div class="card">' +
        '<div class="t-top"><h2>Intervals</h2><span class="badge ' + st.cls + '" id="alloc">' + st.text + '</span></div>' +
        list +
        (draft.reorder ? '' : '<button data-act="addiv">Add interval</button>') +
        (draft.intervals.length > 1 ? '<button data-act="reorder" class="' + (draft.reorder ? 'primary' : '') + '">' + (draft.reorder ? 'Done reordering' : 'Reorder intervals') + '</button>' : '') +
      '</div>' +
      '<button class="primary big" data-act="savetimer" id="savetimer">Save timer</button>' + del;
  }
  function updateEditTotal() {
    var el = document.getElementById('alloc');
    if (!el) return;
    var st = allocStatus();
    el.textContent = st.text;
    el.className = 'badge ' + st.cls;
    var sv = document.getElementById('savetimer');
    if (sv) sv.disabled = allocInfo().left < 0 || !draft.intervals.length;
  }

  /* Run */
  function runHTML() {
    var segs = run.durs.map(function (d, i) { return '<div class="seg" style="flex:' + d + ' 1 0"><i id="seg-' + i + '"></i></div>'; }).join('');
    return '<div class="topbar"><h1>' + esc(run.timerName) + '</h1></div>' +
      '<div class="card runcard" id="runcard">' +
        '<div class="meta"><span class="nm" id="ivlabel"></span><span>Total left <span class="num" id="totleft" style="color:var(--fg)"></span></span></div>' +
        '<div class="clock" id="clock"></div>' +
        '<div class="pill" id="pill"></div>' +
        '<div class="segs">' + segs + '</div>' +
      '</div>' +
      '<button class="primary big" data-act="done" id="done"></button>' +
      '<div class="btns"><button data-act="pause" id="pause">Pause</button>' +
      '<button class="danger' + (A('discard') ? ' armed' : '') + '" data-act="discard">' + (A('discard') ? 'Tap again to discard' : 'Discard run') + '</button></div>';
  }
  function startRun(timerId) {
    var t = getTimer(timerId);
    if (!t) return;
    run = {
      timerId: t.id, timerName: t.name,
      durs: t.intervals.map(function (i) { return i.min * 60000; }),
      iids: t.intervals.map(function (i) { return i.id; }),
      names: t.intervals.map(function (i) { return i.name; }),
      idx: 0, ivAcc: 0, last: Date.now(), running: true, carry: 0, sumActual: 0, log: []
    };
    persistRun();
    go({ name: 'run' });
    getWake();
  }
  function persistRun() { if (run) { run.saved = Date.now(); lsSet(ACTIVE_KEY, JSON.stringify(run)); } else lsDel(ACTIVE_KEY); }
  function accumulate() {
    if (run && run.running) { var now = Date.now(); run.ivAcc += Math.max(0, now - run.last); run.last = now; }
  }
  function updateRun() {
    if (!run || view.name !== 'run') return;
    accumulate();
    var clock = document.getElementById('clock');
    if (!clock) return;
    var remaining = run.durs[run.idx] - run.ivAcc;
    clock.textContent = (remaining < 0 ? '−' : '') + countdown(remaining);
    clock.className = 'clock' + (remaining < 0 ? ' neg' : '');
    var drift = run.carry - Math.max(0, run.ivAcc - run.durs[run.idx]);
    var pill = document.getElementById('pill');
    pill.textContent = driftText(drift);
    pill.className = 'pill ' + driftCls(drift);
    /* Box color: past the interval time = red, last 10 seconds = yellow, otherwise green while ahead overall. */
    var state = remaining < 0 ? 'st-over' : (remaining <= db.settings.warnSecs * 1000 ? 'st-warn' : (driftCls(drift) === 'ahead' ? 'st-ahead' : ''));
    document.getElementById('runcard').className = 'card runcard ' + state;
    var totalLeft = sum(run.durs) - (run.sumActual + run.ivAcc);
    var tl = document.getElementById('totleft');
    tl.textContent = (totalLeft < 0 ? '−' : '') + countdown(totalLeft);
    tl.style.color = totalLeft < 0 ? 'var(--bad)' : 'var(--fg)';
    document.getElementById('ivlabel').textContent = run.names[run.idx] + ' · ' + (run.idx + 1) + ' of ' + run.durs.length;
    for (var i = 0; i < run.durs.length; i++) {
      var w = i < run.idx ? 100 : (i === run.idx ? Math.min(100, run.ivAcc / run.durs[i] * 100) : 0);
      document.getElementById('seg-' + i).style.width = w + '%';
    }
    var last = run.idx === run.durs.length - 1;
    document.getElementById('done').textContent = last ? 'Finish' : 'Done with ' + run.names[run.idx];
    document.getElementById('pause').textContent = run.running ? 'Pause' : 'Resume';
  }
  function finishInterval() {
    accumulate();
    var d = run.durs[run.idx];
    run.log.push({ iid: run.iids[run.idx], name: run.names[run.idx], planned: d, actual: run.ivAcc });
    run.carry += d - run.ivAcc;
    run.sumActual += run.ivAcc;
    run.idx++;
    run.ivAcc = 0;
    run.last = Date.now();
    if (run.idx >= run.durs.length) {
      var rec = {
        id: uid(), timerId: run.timerId, timerName: run.timerName, date: Date.now(),
        planned: sum(run.durs), actual: run.sumActual, intervals: run.log
      };
      db.runs.push(rec);
      save();
      run = null; persistRun(); releaseWake();
      go({ name: 'summary', id: rec.id });
    } else {
      persistRun();
      updateRun();
    }
  }
  function startTick(fn) { stopTick(); tick = setInterval(fn || updateRun, 200); }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
  function getWake() {
    try {
      if (navigator.wakeLock && !wake && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(function (l) {
          wake = l; l.addEventListener('release', function () { wake = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function releaseWake() { try { if (wake) { wake.release(); wake = null; } } catch (e) {} }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && view.name === 'run' && run && run.running) { getWake(); updateRun(); }
    if (document.visibilityState === 'visible' && view.name === 'prun' && prun && prun.running) { getWake(); updatePrun(); }
  });

  /* Summary */
  function summaryHTML() {
    var r = db.runs.filter(function (x) { return x.id === view.id; })[0];
    if (!r) return '<div class="card empty">That run is no longer saved.</div><button class="primary big" data-act="home">Back to timers</button>';
    var prev = runsFor(r.timerId).filter(function (x) { return x.id !== r.id; });
    var drift = r.planned - r.actual;
    var rows = r.intervals.map(function (e) {
      var d = e.planned - e.actual;
      var pv = prev.map(function (p) { return p.intervals.filter(function (q) { return q.iid === e.iid; })[0]; }).filter(Boolean);
      var pa = pv.length ? fmtMs(avg(pv.map(function (q) { return q.actual; }))) : '–';
      return '<tr><td class="nm">' + esc(e.name) + '</td><td class="r m">' + fmtMs(e.planned) + '</td><td class="r m">' + fmtMs(e.actual) +
        '</td><td class="r m ' + textCls(d) + '">' + (driftSecs(d) < 1 ? 'on time' : (d > 0 ? '−' : '+') + fmt(driftSecs(d))) + '</td><td class="r m">' + pa + '</td></tr>';
    }).join('');
    var vs = '';
    if (prev.length) {
      var pavg = avg(prev.map(function (x) { return x.actual; }));
      var diff = pavg - r.actual;
      vs = '<div class="muted">' + (driftSecs(diff) < 1 ? 'Same as your average total of ' + fmtMs(pavg) :
        fmt(driftSecs(diff)) + (diff > 0 ? ' faster' : ' slower') + ' than your average total of ' + fmtMs(pavg)) + ' (' + prev.length + ' earlier run' + (prev.length === 1 ? '' : 's') + ')</div>';
    } else vs = '<div class="muted">First saved run for this timer. Later runs will compare against it.</div>';
    return '<div class="topbar"><h1>' + esc(r.timerName) + '</h1></div>' +
      '<div class="card"><div class="hero"><h2>Run saved</h2>' +
        '<div class="big ' + textCls(drift) + '">' + driftText(drift) + '</div>' +
        '<div class="muted">Planned ' + fmtMs(r.planned) + ' &middot; Took ' + fmtMs(r.actual) + '</div>' + vs + '</div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Interval</th><th class="r">Plan</th><th class="r">Actual</th><th class="r">Diff</th><th class="r">Avg before</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</div>' +
      '<div class="btns">' +
        (getTimer(r.timerId) ? '<button class="primary" data-act="start" data-id="' + r.timerId + '">Run again</button>' : '') +
        '<button data-act="stats" data-id="' + r.timerId + '">Stats</button>' +
        '<button data-act="home">Done</button>' +
      '</div>' +
      '<button class="danger' + (A('delrun') ? ' armed' : '') + '" data-act="delrun" data-id="' + r.id + '" data-back="home">' + (A('delrun') ? 'Tap again to delete this run' : 'Delete this run') + '</button>';
  }

  /* Stats */
  function statsHTML() {
    var t = getTimer(view.id);
    if (!t) return '<div class="card empty">Timer not found.</div><button class="primary big" data-act="home">Back to timers</button>';
    var rs = runsFor(t.id);
    var head = '<div class="topbar"><button class="ghost small" data-act="home">&lsaquo; Back</button><h1>' + esc(t.name) + '</h1></div>';
    if (!rs.length) {
      return head + '<div class="card empty">No runs saved for this timer yet. Finish a run and its times show up here.</div>' +
        '<button class="primary big" data-act="start" data-id="' + t.id + '">Start</button>';
    }
    var totals = rs.map(function (r) { return r.actual; });
    var drifts = rs.map(function (r) { return r.planned - r.actual; });
    var avgDrift = avg(drifts);
    var tiles = '<div class="tiles">' +
      '<div class="tile"><span class="v">' + rs.length + '</span><span class="k">Runs saved</span></div>' +
      '<div class="tile"><span class="v">' + fmtMs(avg(totals)) + '</span><span class="k">Average total (plan ' + fmt(timerTotalMin(t) * 60) + ')</span></div>' +
      '<div class="tile"><span class="v ' + textCls(avgDrift) + '">' + driftText(avgDrift) + '</span><span class="k">Average vs plan</span></div>' +
      '<div class="tile"><span class="v">' + fmtMs(Math.min.apply(null, totals)) + '</span><span class="k">Best total</span></div>' +
      '</div>';
    var rows = t.intervals.map(function (iv) {
      var es = rs.map(function (r) { return r.intervals.filter(function (e) { return e.iid === iv.id; })[0]; }).filter(Boolean);
      if (!es.length) return '<tr><td class="nm">' + esc(iv.name) + '</td><td class="r m">' + fmt(iv.min * 60) + '</td><td class="r m">–</td><td class="r m">–</td><td class="r m">–</td></tr>';
      var a = avg(es.map(function (e) { return e.actual; }));

      return '<tr><td class="nm">' + esc(iv.name) + '</td><td class="r m">' + fmt(iv.min * 60) + '</td>' +
        '<td class="r m ' + textCls(planned - a) + '">' + fmtMs(a) + '</td>' +
        '<td class="r m">' + fmtMs(Math.min.apply(null, es.map(function (e) { return e.actual; }))) + '</td>' +
        '<td class="r m">' + fmtMs(es[es.length - 1].actual) + '</td></tr>';
    }).join('');
    var hist = rs.slice().reverse().map(function (r) {
      var d = r.planned - r.actual;
      var key = 'delrun-' + r.id;

        '<span class="badge ' + driftCls(d) + '">' + driftText(d) + '</span>' +
        '<button class="small danger' + (A(key) ? ' armed' : '') + '" data-act="delrun" data-id="' + r.id + '" data-key="' + key + '">' + (A(key) ? 'Confirm' : 'Delete') + '</button></div>';

      '<div class="card"><h2>Ahead or behind, last ' + (rs.length === 1 ? 'run' : Math.min(12, rs.length) + ' runs') + '</h2>' + driftChart(rs) +
        '<div class="legend"><span style="--c:var(--good)">Ahead of plan</span><span style="--c:var(--bad)">Behind plan</span></div></div>' +
      lineCard(t, rs) +

  /* Trend chart: bars from a zero baseline; up = ahead of plan, down = behind. One scale for marks, grid and labels. */
  function driftChart(runs) {
    var data = runs.slice(-12);
    var W = 320, H = 168, L = 46, R = 8, T = 12, B = 24;
    var vals = data.map(function (r) { return (r.planned - r.actual) / 1000; });
    var maxV = Math.max(0, Math.max.apply(null, vals)), minV = Math.min(0, Math.min.apply(null, vals));
    var hi = maxV, lo = minV;
    if (hi === 0 && lo === 0) hi = 1;
    var pad = (hi - lo) * 0.08;
    if (hi > 0) hi += pad;
    if (lo < 0) lo -= pad;
    function y(v) { return T + (hi - v) / (hi - lo) * (H - T - B); }
    var zero = y(0);
    var n = data.length, slot = (W - L - R) / n, bw = Math.min(26, slot * 0.62);
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Ahead or behind plan for the last ' + n + ' runs">';
    function label(v, txt) {
      if (Math.abs(y(v) - zero) < 12) return;
      out += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/>' +
        '<text class="ct" x="' + (L - 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + txt + '</text>';
    }
    if (maxV > 0) label(maxV, '+' + fmt(Math.round(maxV)));
    if (minV < 0) label(minV, '−' + fmt(Math.round(-minV)));
    out += '<line class="zero" x1="' + L + '" x2="' + (W - R) + '" y1="' + zero.toFixed(1) + '" y2="' + zero.toFixed(1) + '"/>' +
      '<text class="ct" x="' + (L - 6) + '" y="' + (zero + 3.5).toFixed(1) + '" text-anchor="end">0:00</text>';
    data.forEach(function (r, i) {
      var v = vals[i], x = L + slot * i + (slot - bw) / 2, top, h;
      if (v >= 0) { top = Math.min(y(v), zero - 2); h = zero - top; }
      else { top = zero; h = Math.max(y(v) - zero, 2); }
      var runNo = runs.length - n + i + 1;
      var cls = v >= 0 ? 'b-good' : 'b-bad';
      var tip = 'Run ' + runNo + ': ' + driftText(v * 1000);
      out += '<rect class="' + cls + '" x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3"><title>' + tip + '</title></rect>' +
        '<text class="ct" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + runNo + '</text>';
    });
    return out + '</svg>';
  }

  /* Line chart: actual time of each interval, run by run. Lines break where a run has no entry for that interval. */
  function lineCard(t, rs) {
    var data = rs.slice(-12), n = data.length;
    var series = [];
    t.intervals.slice(0, 8).forEach(function (iv, k) {
      var vals = data.map(function (r) {
        var e = r.intervals.filter(function (x) { return x.iid === iv.id; })[0];
        return e ? e.actual / 1000 : null;
      });
      if (vals.some(function (v) { return v !== null; })) series.push({ iv: iv, slot: k + 1, vals: vals });
    });
    if (!series.length) return '';
    var all = [];
    series.forEach(function (s) { s.vals.forEach(function (v) { if (v !== null) all.push(v); }); });
    var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
    var span = Math.max(mx - mn, 10);
    var lo = Math.max(0, mn - span * 0.15), hi = mx + span * 0.15;
    var steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600], step = steps[steps.length - 1];
    for (var s0 = 0; s0 < steps.length; s0++) { if ((hi - lo) / steps[s0] <= 4) { step = steps[s0]; break; } }

        '<text class="ct" x="' + (L - 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + fmt(v) + '</text>';
    }
    for (var i = 0; i < n; i++) {
      out += '<text class="ct" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + (rs.length - n + i + 1) + '</text>';
    }
    series.forEach(function (s) {
      var d = '', pen = false;
      s.vals.forEach(function (val, i) {
        if (val === null) { pen = false; return; }

        pen = true;
      });
      out += '<path d="' + d + '" fill="none" stroke="var(--s' + s.slot + ')" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    });
    series.forEach(function (s) {
      s.vals.forEach(function (val, i) {
        if (val === null) return;
        out += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(val).toFixed(1) + '" r="4" fill="var(--s' + s.slot + ')" stroke="var(--surface)" stroke-width="2"><title>' +
          esc(s.iv.name) + ', run ' + (rs.length - n + i + 1) + ': ' + fmt(val) + '</title></circle>';

    out += '</svg>';
    var legend = '<div class="legend">' + series.map(function (s) { return '<span style="--c:var(--s' + s.slot + ')">' + esc(s.iv.name) + '</span>'; }).join('') + '</div>';

    if (n < 2) notes += '<div class="muted">Run this timer again to see each interval as a line.</div>';
    if (t.intervals.length > 8) notes += '<div class="muted">Showing the first 8 of ' + t.intervals.length + ' intervals.</div>';
    return '<div class="card"><h2>Time per interval, by run</h2>' + out + legend + notes + '</div>';
  }

  function backupJSON() {

  }

  /* ---------- Music library (IndexedDB) ---------- */

  /* ---------- Audio: generated brown noise, music playlist, chime ---------- */
  var au = { ctx: null, bufs: {}, kind: 'off', noise: null, gain: null, noiseOn: false, noiseVol: 0.4, el: null, list: [], idx: 0, musicOn: false, musicVol: 0.7, url: null, errs: 0 };

  function noiseSeg(act, cur) {

  }

        msg = null;
        var arr = [], left = total, n = 1;
        while (left > 1e-9) { var d = Math.min(len, left); arr.push({ id: uid(), name: 'Interval ' + n++, min: round2(d), u: draft.lu === 'h' ? 'h' : 'm' }); left = round2(left - d); }
        draft.intervals = arr; render();
      }
    }
    else if (act === 'savetimer') {
      if (root.querySelector('.tbox .bad')) { msg = { text: 'Fix the red time box first. Use 5 or 5:30.', err: true }; render(); return; }
      var ivs = draft.intervals.map(function (v) { var o = { id: v.id, name: (v.name || '').trim() || 'Interval', min: round2(num(v.min, 0)) }; if (v.u === 'h') o.u = 'h'; return o; });
      if (!ivs.length) { msg = { text: 'Add at least one interval.', err: true }; render(); return; }
      if (ivs.some(function (v) { return !(v.min > 0); })) { msg = { text: 'Every interval needs a length greater than 0 minutes.', err: true }; render(); return; }
      if (allocInfo().left < 0) { msg = { text: 'The intervals add up to more than the total time. Shorten an interval or raise the total.', err: true }; render(); return; }
      var rec = { id: draft.id, name: draft.name.trim() || 'Untitled timer', total: allocInfo().tot, intervals: ivs }; if (draft.tu === 'h') rec.tu = 'h';
      var at = db.timers.map(function (t) { return t.id; }).indexOf(rec.id);
      if (at >= 0) db.timers[at] = rec; else db.timers.push(rec);
      save(); draft = null; msg = null; go({ name: 'home' });
    }
    else if (act === 'deltimer') arm('deltimer', function () {
      db.timers = db.timers.filter(function (t) { return t.id !== draft.id; });
      db.runs = db.runs.filter(function (r) { return r.timerId !== draft.id; });
      save(); draft = null; go({ name: 'home' });
    });
    else if (act === 'done') finishInterval();
    else if (act === 'pause') {
      if (run.running) { accumulate(); run.running = false; } else { run.running = true; run.last = Date.now(); getWake(); }
      persistRun(); updateRun();
    }
    else if (act === 'discard') arm('discard', function () { run = null; persistRun(); releaseWake(); go({ name: 'home' }); });
    else if (act === 'delrun') {
      var key = b.dataset.key || 'delrun';
      arm(key, function () {
        db.runs = db.runs.filter(function (r) { return r.id !== id; });
        save();
        if (view.name === 'summary') go({ name: 'home' }); else render();
      });
    }
    else if (act === 'backup') {
      var blob = new Blob([backupJSON()], { type: 'application/json' });
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      var dt = new Date();
      a.href = url; a.download = 'interval-timer-backup-' + dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2) + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      db.lastBackup = Date.now(); save();
      msg = { text: 'Backup file created. Check your Downloads or Files app.' }; render();
    }
    else if (act === 'copybackup') {
      var text = backupJSON();
      var fallback = function () {
        pasteText = text; msg = { text: 'Copying was blocked. The backup text is in the box below; select all and copy it.', err: true };
        db.lastBackup = Date.now(); save(); render();
        var pb = document.getElementById('pastebox'); if (pb) { pb.focus(); pb.select(); }
      };
      try {
        navigator.clipboard.writeText(text).then(function () {
          db.lastBackup = Date.now(); save(); msg = { text: 'Backup text copied.' }; render();
        }, fallback);
      } catch (err) { fallback(); }
    }
    else if (act === 'importpaste') { var pv = document.getElementById('pastebox').value.trim(); pasteText = ''; if (pv) stageImport(pv); else { msg = { text: 'Paste backup text first.', err: true }; render(); } }
    else if (act === 'resetlook') { db.settings.colors = {}; db.settings.fonts = {}; save(); applyCustom(); render(); }
    else if (act === 'theme') { db.settings.theme = b.dataset.v; save(); applyTheme(); render(); }
    else if (act === 'cancelimport') { pending = null; msg = null; render(); }
    else if (act === 'merge') {
      var haveT = {}, haveR = {};
      db.timers.forEach(function (t) { haveT[t.id] = 1; });
      db.runs.forEach(function (r) { haveR[r.id] = 1; });
      var addT = pending.timers.filter(function (t) { return !haveT[t.id]; }), addR = pending.runs.filter(function (r) { return !haveR[r.id]; });
      var haveS = {}; db.sessions.forEach(function (q) { haveS[q.id] = 1; });
      var addS = (pending.sessions || []).filter(function (q) { return !haveS[q.id]; });
      db.timers = db.timers.concat(addT); db.runs = db.runs.concat(addR); db.sessions = db.sessions.concat(addS); save();
      msg = { text: 'Merged: added ' + addT.length + ' timer' + (addT.length === 1 ? '' : 's') + ', ' + addR.length + ' run' + (addR.length === 1 ? '' : 's') + ' and ' + addS.length + ' Pomodoro session' + (addS.length === 1 ? '' : 's') + '.' };
      pending = null; render();
    }
    else if (act === 'replace') arm('replace', function () {
      db.timers = pending.timers; db.runs = pending.runs; if (pending.sessions) db.sessions = pending.sessions; if (pending.settings) db.settings = pending.settings; save(); applyTheme();
      msg = { text: 'Replaced with backup: ' + db.timers.length + ' timers, ' + db.runs.length + ' runs.' };
      pending = null; render();
    });
  });

  /* ---------- Resume: keep where the person left off ---------- */
  var UI_KEY = 'tie.ui.v1';
  function settleOnOpen(r, accKey) {
    /* Closed for under 2 minutes: keep running as if nothing happened. Longer: stop the clock where it was last saved and wait on Resume. */
    var now = Date.now(), saved = r.saved || r.last;
    if (r.running && now - saved > 120000) {
      r[accKey] += Math.max(0, saved - r.last);
      r.running = false; r.last = now;
    }
    return r;
  }
  function persistUI() {
    try {
      if (run || prun) { lsDel(UI_KEY); return; }
      var v = view.name;
      if (['home', 'edit', 'pedit', 'stats', 'data', 'summary'].indexOf(v) < 0) return;
      lsSet(UI_KEY, JSON.stringify({ view: view, homeTab: homeTab, draft: v === 'edit' ? draft : null, sdraft: v === 'pedit' ? sdraft : null }));
    } catch (e) {}
  }
  var uiTimer = null;
  function persistUISoon() { clearTimeout(uiTimer); uiTimer = setTimeout(persistUI, 250); }
  function heartbeat() { if (run && run.running) persistRun(); if (prun && prun.running) persistPrun(); persistUI(); }
  setInterval(heartbeat, 5000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') heartbeat(); });
  window.addEventListener('pagehide', heartbeat);
  root.addEventListener('input', persistUISoon);
  root.addEventListener('change', persistUISoon);
  root.addEventListener('click', persistUISoon);

  /* ---------- Boot: resume an unfinished run if one was saved ---------- */
  try {
    var saved = lsGet(ACTIVE_KEY);
    if (saved) {
      var r = JSON.parse(saved);
      if (r && Array.isArray(r.durs) && r.durs.length && r.idx < r.durs.length && getTimer(r.timerId)) {
        run = settleOnOpen(r, 'ivAcc'); view = { name: 'run' };
      } else lsDel(ACTIVE_KEY);
    }
  } catch (e) { lsDel(ACTIVE_KEY); }
  try {
    var psaved = lsGet(POMO_KEY);
    if (psaved && !run) {
      var pr = JSON.parse(psaved);
      if (pr && Array.isArray(pr.ph) && pr.ph.length && pr.idx < pr.ph.length) {
        prun = settleOnOpen(pr, 'acc'); view = { name: 'prun' };
      } else lsDel(POMO_KEY);
    }
  } catch (e) { lsDel(POMO_KEY); }
  if (!run && !prun) {
    try {
      var us = JSON.parse(lsGet(UI_KEY) || 'null');
      if (us && us.view && typeof us.view.name === 'string') {
        var vn = us.view.name;
        if (us.homeTab === 'pomo') homeTab = 'pomo';
        if (vn === 'edit' && us.draft && Array.isArray(us.draft.intervals)) { draft = us.draft; view = { name: 'edit' }; }
        else if (vn === 'pedit' && us.sdraft && Array.isArray(us.sdraft.tasks) && Array.isArray(us.sdraft.playlist)) { sdraft = us.sdraft; view = { name: 'pedit' }; }
        else if (vn === 'stats' && getTimer(us.view.id)) view = { name: 'stats', id: us.view.id };
        else if (vn === 'summary' && db.runs.some(function (x) { return x.id === us.view.id; })) view = { name: 'summary', id: us.view.id };
        else if (vn === 'data') view = { name: 'data' };
      }
    } catch (e) {}
  }
  idbOpen(function () {
    idbLoad(function () {
      if (prun) { prepList(getSession(prun.sid)); }
      if (['home', 'pedit', 'data', 'prun'].indexOf(view.name) >= 0) render();
    });
  });
  render();
  if ((run && run.running) || (prun && prun.running)) getWake();
  var sp = document.getElementById('splash');
  if (sp) setTimeout(function () { sp.classList.add('out'); setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 400); }, 900);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
